services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fullstack-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"
    volumes:
      - ./backend/scripts/database/entrypoint:/docker-entrypoint-initdb.d
      - ./dockerdata/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fullstack-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - ./dockerdata/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fullstack-network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      target: development
      dockerfile: Dockerfile
    container_name: fullstack-api
    working_dir: /app/src
    volumes:
      - ./backend:/app/src
      - ./dockerdata/backend-poetry-cache:/root/.cache/pypoetry
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=fullstack-api
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - EJSON_PUBLIC_KEY=6256bbbb216566dd58f2469d75e480b04793191064ab19c5cb8046c012a1fc25
      - EJSON_PRIVATE_KEY=02656c1694ded4f36048115b53f4b32087a817b3339e3fe1c025b6a312313dee
      - DEBUG=1
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    entrypoint: ["sh", "-c"]
    command: ["./scripts/docker/api.entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fullstack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker
  worker:
    build:
      context: ./backend
      target: development
      dockerfile: Dockerfile
    container_name: fullstack-worker
    working_dir: /app/src
    volumes:
      - ./backend:/app/src
      - ./dockerdata/backend-poetry-cache:/root/.cache/pypoetry
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=fullstack-worker
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - EJSON_PUBLIC_KEY=6256bbbb216566dd58f2469d75e480b04793191064ab19c5cb8046c012a1fc25
      - EJSON_PRIVATE_KEY=02656c1694ded4f36048115b53f4b32087a817b3339e3fe1c025b6a312313dee
      - RUN_CELERY_BEAT=true
      - DEBUG=1
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    entrypoint: ["sh", "-c"]
    command: ["./scripts/docker/worker.entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fullstack-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.app", "inspect", "ping", "-d", "celery@worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SvelteKit Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "5173:5173"
    networks:
      - fullstack-network
    command: npm run dev

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: fullstack-caddy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dockerdata/caddy-data:/data
      - ./dockerdata/caddy-config:/config
    networks:
      - fullstack-network
    depends_on:
      - api
      - frontend

volumes:
  frontend-node-modules:

networks:
  fullstack-network:
    driver: bridge
